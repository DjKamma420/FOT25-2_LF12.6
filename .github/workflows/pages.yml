name: Rechentrainer veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'src/**'
      - 'web/**'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_name: ${{ steps.compile.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v5

      - name: C++ für den Browser kompilieren
        id: compile
        run: |
          git clone --depth 1 --branch 4.0.21 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.21
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.21
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"

          mkdir -p _site
          em++ -std=c++17 web/browser.cpp src/*.cpp -lembind -o _site/rechentrainer.js
          cp web/index.html web/style.css web/pwa.js web/manifest.webmanifest _site/
          cp -R web/assets _site/
          sed "s/BUILD_REVISION/$GITHUB_SHA/" web/service-worker.js > _site/service-worker.js
          printf 'artifact_name=github-pages-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.compile.outputs.artifact_name }}
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf Build-Paket warten
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          for attempt in {1..10}; do
            if count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f "name=$ARTIFACT_NAME" --jq '.total_count') && [[ "$count" == 1 ]]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Build artifact $ARTIFACT_NAME was not available exactly once."
          exit 1

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
